<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0f1a;
            color: #e8edf5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .error-container {
            max-width: 600px;
            text-align: center;
            background: #141b2b;
            padding: 40px 50px;
            border-radius: 20px;
            border: 1px solid #2a3a5c;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        .error-code {
            font-size: 80px;
            font-weight: 800;
            background: linear-gradient(135deg, #f97316, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 10px;
        }

        .error-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #e8edf5;
        }

        .error-message {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-home {
            display: inline-block;
            background: #f97316;
            color: #fff;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-home:hover {
            background: #ea580c;
        }

        .btn-home i {
            margin-right: 8px;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #4b5a7a;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-title">Page Not Found</div>
        <div class="error-message">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </div>
        <a href="/" class="btn-home">🏠 Go to Home</a>
        <div class="footer">Traxen Logistics • Decentralized Shipping</div>
    </div>
</body>

</html>
