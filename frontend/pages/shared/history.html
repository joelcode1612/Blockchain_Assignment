<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traxen — Transaction History</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/shipper_styles.css">
  <link rel="stylesheet" href="/css/carrier_styles.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>
  <div class="app">
    <div class="content">

      <!-- Stats Row -->
      <div class="stat-row" id="statsRow">
        <div class="stat-card">
          <div class="lbl">Total Payments</div>
          <div class="val" id="totalPayments">—</div>
        </div>
        <div class="stat-card">
          <div class="lbl">Total ETH Released</div>
          <div class="val lime" id="totalEth">—</div>
        </div>
        <div class="stat-card">
          <div class="lbl">Latest Payment</div>
          <div class="val" id="latestPayment">—</div>
        </div>
        <div class="stat-card">
          <div class="lbl">Agreements</div>
          <div class="val" id="agreementIdDisplay">All</div>
        </div>
      </div>

      <!-- Transactions Table -->
      <div class="panel">
        <h2>Transactions</h2>
        <div class="desc" id="historyDesc">All recorded payments</div>
        <div id="historyContent">
          <div style="color:var(--text-faint);padding:12px 0;">Loading transactions...</div>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast container (used by showToast) -->
  <div id="toast-container"></div>

  <!-- Scripts — absolute paths -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <script src="/js/shared/common.js"></script>
  <script src="/js/blockchain/web3_integration.js"></script>
  <script src="/js/shared/auth.js"></script>
  <script src="/js/shared/history.js"></script>

  <!-- Standalone init (only fires if history.js didn't auto-init) -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (
        typeof window.initHistory === "function" &&
        document.getElementById("historyContent")
      ) {
        // If the SPA router isn't managing this page, run init manually.
        // If it is, this is a no-op because initHistory has already run.
        if (!window.__historyInitialized) {
          window.__historyInitialized = true;
          window.initHistory();
        }
      }
    });
  </script>
</body>

</html>
