<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Traxen — Login</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/auth.css">
</head>

<body>
    <main class="auth-stage">
        <a class="auth-back" href="/">← Back to Home</a>
        <section class="auth-card">
            <div class="auth-brand">
                <div class="brand-mark">T</div> Traxen
            </div>

            <div id="authAlert" class="auth-alert hidden"></div>
            <h2 class="title">Welcome back</h2>
            <p class="subtitle">Connect your wallet to log in to Traxen</p>

            <!-- MetaMask Option -->
            <div class="wallet-opt" onclick="selectWallet(this,'login')">
                <div class="wallet-icon metamask">🦊</div>
                <div>
                    <div class="wallet-name">MetaMask</div>
                    <div class="wallet-sub">Connect using browser extension</div>
                </div>
            </div>

            <!-- WalletConnect Option -->
            <div class="wallet-opt" onclick="selectWallet(this,'login')">
                <div class="wallet-icon walletconnect">◆</div>
                <div>
                    <div class="wallet-name">WalletConnect</div>
                    <div class="wallet-sub">Scan with a mobile wallet</div>
                </div>
            </div>

            <!-- Wallet Status Line -->
            <div class="status-line" id="loginWalletStatus">
                <div class="status-dot"></div><span>No wallet connected</span>
            </div>

            <!-- Register Link -->
            <div class="foot-link" style="margin-top: 24px;">
                Don't have an account? <a href="register.html">Register</a>
            </div>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script>
    <script src="../../js/blockchain/web3_integration.js"></script>
    <script src="../../js/shared/auth.js"></script>
</body>

</html>
