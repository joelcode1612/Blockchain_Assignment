<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Traxen — Login</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/auth.css">
</head>

<body>
    <main class="auth-stage">
        <a class="auth-back" href="index.html">← Back to Home</a>
        <section class="auth-card">
            <div class="auth-brand">
                <div class="brand-mark">T</div> Traxen
            </div>
            <h2 class="title">Welcome back</h2>
            <p class="subtitle">Log in to your Traxen account to continue</p>
            <div class="wallet-opt" onclick="selectWallet(this,'login')">
                <div class="wallet-icon metamask">🦊</div>
                <div>
                    <div class="wallet-name">MetaMask</div>
                    <div class="wallet-sub">Connect using browser extension</div>
                </div>
            </div>
            <div class="wallet-opt" onclick="selectWallet(this,'login')">
                <div class="wallet-icon walletconnect">◆</div>
                <div>
                    <div class="wallet-name">WalletConnect</div>
                    <div class="wallet-sub">Scan with a mobile wallet</div>
                </div>
            </div>
            <div class="status-line" id="loginWalletStatus">
                <div class="status-dot"></div><span>No wallet connected</span>
            </div>
            <div class="divider">or log in with email</div>
            <div class="field"><label>Email Address</label><input id="loginEmail" type="email"
                    placeholder="you@company.com"></div>
            <div class="field"><label>Password</label>
                <div class="pw-wrap"><input id="loginPw" type="password" placeholder="Your password"><span
                        class="pw-toggle" onclick="togglePw('loginPw')">SHOW</span></div>
            </div>
            <div class="row-inline"><label class="remember"><input type="checkbox"> Remember me</label><a href="#"
                    onclick="return false;">Forgot password?</a></div>
            <button class="btn btn-primary btn-block" onclick="doLogin()">Log In</button>
            <div class="foot-link">Don't have an account? <a href="register.html">Register</a></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script>
    <script src="../../js/blockchain/web3_integration.js"></script>
    <script src="../../js/auth.js"></script>
</body>

</html>
