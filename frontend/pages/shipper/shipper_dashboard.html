<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traxen — Shipper Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/shipper.css" />
    <link rel="stylesheet" href="/css/profile.css" />
    <link rel="stylesheet" href="/css/shipper_create_agreement.css" />
</head>

<body>
    <div id="toast-container"
        style="position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;">
    </div>
    <div class="app">
        <!-- ─── STATIC SIDEBAR ─────────────────────────────── -->
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">T</span> Traxen</div>

            <nav class="nav-group">
                <!-- Dashboard -->
                <a href="/shipper_dashboard.html" class="nav-item active" data-page="dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                    </svg>
                    Dashboard
                </a>

                <!-- Agreements -->
                <a href="/agreements.html" class="nav-item" data-page="agreements">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 12h6M9 16h6M9 8h6" />
                        <rect x="4" y="4" width="16" height="16" rx="2" />
                    </svg>
                    Agreements
                </a>

                <!-- Create Agreement -->
                <a href="/create_agreement.html" class="nav-item" data-page="create_agreement">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                    Create Agreement
                </a>

                <!-- Escrow Overview -->
                <a href="/deposit_balance.html" class="nav-item" data-page="deposit_balance">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 7v5l3 3" />
                    </svg>
                    Escrow Overview
                </a>

                <!-- Milestone Tracking -->
                <a href="/milestone_release.html" class="nav-item" data-page="milestone_release">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M9 12l2 2 4-4" />
                    </svg>
                    Milestone Tracking
                </a>

                <!-- Refund Centre -->
                <a href="/refund_expiry.html" class="nav-item" data-page="refund_expiry">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 7v5l3 3" />
                    </svg>
                    Refund Centre
                </a>

                <!-- Transaction History -->
                <a href="/history.html" class="nav-item" data-page="history">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7" />
                        <path d="M21 21l-4-4" />
                    </svg>
                    Transaction History
                </a>
            </nav>

            <!-- Account Section -->
            <div class="nav-group">
                <div class="nav-label">Account</div>

                <!-- Profile -->
                <a href="/shipper_profile.html" class="nav-item" data-page="profile">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
                    </svg>
                    Profile
                </a>

                <!-- Settings -->
                <a href="/settings.html" class="nav-item" data-page="settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 8v4l3 2" />
                    </svg>
                    Settings
                </a>
            </div>

            <!-- Sidebar Footer with Logout Icon -->
            <div class="sidebar-foot" style="display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="mini-avatar" id="miniAvatar">MJ</div>
                    <div>
                        <div class="mini-name" id="miniName">Mike Johnson</div>
                        <div class="mini-role" id="miniRole">Shipper</div>
                    </div>
                </div>
                <a href="#" onclick="handleLogout(event)" class="logout-btn" title="Log out"
                    style="color: #8892b0; display: flex; padding: 8px; border-radius: 6px; transition: background 0.2s;">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </a>
            </div>
        </aside>

        <!-- ─── MAIN CONTENT AREA ──────────────────────────── -->
        <main class="main">
            <header class="topbar">
                <div>
                    <h1 id="pageTitle">Dashboard</h1>
                    <div class="sub" id="pageSub">Welcome back</div>
                </div>
                <div class="topbar-actions">
                    <!-- optional actions -->
                </div>
            </header>

            <!-- DYNAMIC CONTENT GOES HERE -->
            <div class="content" id="contentPlaceholder">
                <!-- Loaded by shipper.js -->
                <p>Loading...</p>
            </div>
        </main>
    </div>

    <!-- ─── SCRIPTS ────────────────────────────────────────── -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="/js/blockchain/web3_integration.js"></script>
    <script src="/js/shipper/create_agreement.js"></script>
    <script src="/js/shared/auth.js"></script>
    <script src="/js/shipper/shipper.js"></script>
    <script src="/js/shared/common.js"></script>
    <script src="/js/shared/agreements.js"></script>
    <script src="/js/shipper/deposit_balance.js"></script>
    <script src="/js/shipper/milestone_release.js"></script>
    <script src="/js/shipper/refund_expiry.js"></script>
    <script src="/js/shipper/shipper_profile.js"></script>
    <script src="/js/shared/history.js"></script>
</body>

</html>
