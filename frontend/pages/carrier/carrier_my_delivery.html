<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Traxen — My Deliveries</title>

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/carrier_agreements.css">
</head>

<body>
    <div class="app">

        <main class="main">

            <div class="content">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Agreement ID</th>
                                <th>Route / Payload</th>
                                <th>Total Escrow</th>
                                <th>Next Milestone</th>
                                <th>Deadline</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="deliveries-body">
                            <!-- Populated dynamically by JavaScript -->
                            <tr>
                                <td colspan="7" style="text-align:center;padding:40px 0;color:var(--text-faint);">
                                    Loading deliveries...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="/js/blockchain/web3_integration.js"></script>
    <script src="/js/shared/common.js"></script>
    <script src="/js/shared/auth.js"></script>
    <script src="/js/shared/actions.js"></script>
    <script src="/js/carrier/carrier.js"></script>
</body>

</html>
