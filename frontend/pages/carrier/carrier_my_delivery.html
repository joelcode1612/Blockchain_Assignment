<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Traxen — My Deliveries</title>

    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/carrier-agreements.css">
</head>

<body>

    <div class="app">

        <main class="main">

            <div class="content">

                <div class="table-container">

                    <table class="data-table">

                        <thead>

                            <tr>
                                <th>Agreement ID</th>
                                <th>Route / Payload</th>
                                <th>Total Escrow</th>
                                <th>Next Milestone</th>
                                <th>Deadline</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>

                        </thead>


                        <tbody>

                            <!-- DELIVERY 1 -->
                            <tr>

                                <td class="mono">
                                    #AG8901
                                </td>

                                <td>
                                    <b>LA → NY</b>
                                    <br>

                                    <span class="muted-small">
                                        Electronics
                                    </span>
                                </td>

                                <td>
                                    5.00 ETH
                                </td>

                                <td>
                                    2. In Transit Checkpoint
                                </td>

                                <td>
                                    Aug 25, 2026
                                </td>

                                <td>

                                    <span class="status-badge status-action">
                                        <span class="dot"></span>
                                        Proof Required
                                    </span>

                                </td>

                                <td>

                                    <button class="btn btn-primary btn-sm"
                                        onclick="location.href='agreement_details_carrier.html?id=AG8901'">

                                        Submit Proof

                                    </button>

                                </td>

                            </tr>


                            <!-- DELIVERY 2 -->
                            <tr>

                                <td class="mono">
                                    #AG8877
                                </td>

                                <td>
                                    <b>Miami → Atlanta</b>
                                    <br>

                                    <span class="muted-small">
                                        Textiles
                                    </span>
                                </td>

                                <td>
                                    3.20 ETH
                                </td>

                                <td>
                                    3. Out for Delivery
                                </td>

                                <td>
                                    Aug 18, 2026
                                </td>

                                <td>

                                    <span class="status-badge status-active">
                                        <span class="dot"></span>
                                        In Transit
                                    </span>

                                </td>

                                <td>

                                    <button class="btn btn-ghost btn-sm">
                                        View Details
                                    </button>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <!-- Redirect when opened directly (SPA loads this content inline via DOMParser) -->
    <script>
        window.location.replace('carrier.html');
    </script>
</body>

</html>
