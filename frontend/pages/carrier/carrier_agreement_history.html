<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Traxen — Agreement History</title>

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/carrier.css">
    <link rel="stylesheet" href="/css/carrier_agreements.css">
</head>

<body>
    <div class="app">
        <main class="main">
            <div class="content">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Agreement ID</th>
                                <th>Date</th>
                                <th>Shipper</th>
                                <th>Payload</th>
                                <th>Total Earned</th>
                                <!-- /// Yon : REP change column (rep from reputation_history) /// -->
                                <th>REP</th>
                                <th>Contract Status</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                            <tr>
                                <td colspan="7" style="text-align:center;padding:40px 0;color:var(--text-faint);">
                                    Loading history...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

    </div>
</body>

</html>
